<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">SyntaxMaruf terminal introduction</title>
<desc id="desc">A terminal-style animated introduction for Maruf Billah, SyntaxMaruf.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080d16"/><stop offset="1" stop-color="#101c2b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#36e6a0"/><stop offset="1" stop-color="#ffc857"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="3" y="3" width="994" height="584" rx="22" fill="url(#bg)" stroke="#26394d" stroke-width="3"/>
<path d="M3 70H997" stroke="#26394d" stroke-width="2"/>
<circle cx="35" cy="36" r="9" fill="#ff6b6b"/><circle cx="66" cy="36" r="9" fill="#ffc857"/><circle cx="97" cy="36" r="9" fill="#36e6a0"/>
<text x="500" y="43" fill="#91a4b8" text-anchor="middle" font-family="monospace" font-size="18">syntaxmaruf@github: ~/profile</text>
<g font-family="monospace" font-size="25">
  <text x="48" y="118" fill="#36e6a0">$ INCLUDE &lt; WHOAMI.H &gt;</text>
  <text x="48" y="169" fill="#ffc857" font-size="31" font-weight="bold">&gt; Maruf Billah <tspan fill="#71869d">//</tspan> <tspan fill="#36e6a0">SyntaxMaruf</tspan></text>
  <text x="48" y="218" fill="#91a4b8">/* Computer Science &amp; Engineering */</text>
  <text x="48" y="272" fill="#36e6a0">$ cat mission.txt</text>
</g>
<g font-family="monospace" font-size="21" text-anchor="middle">
  <rect x="42" y="300" width="278" height="58" rx="15" fill="#102b29" stroke="#36e6a0"/>
  <text x="181" y="337" fill="#a6f5d2">Write clean C.</text>
  <rect x="361" y="300" width="278" height="58" rx="15" fill="#302817" stroke="#ffc857"/>
  <text x="500" y="337" fill="#ffe0a0">Think like an engineer.</text>
  <rect x="680" y="300" width="278" height="58" rx="15" fill="#102b29" stroke="#36e6a0"/>
  <text x="819" y="337" fill="#a6f5d2">Learn deeply.</text>
  <rect x="42" y="378" width="278" height="58" rx="15" fill="#302817" stroke="#ffc857"/>
  <text x="181" y="415" fill="#ffe0a0">Code daily.</text>
  <rect x="361" y="378" width="278" height="58" rx="15" fill="#102b29" stroke="#36e6a0"/>
  <text x="500" y="415" fill="#a6f5d2">Build real projects.</text>
  <rect x="680" y="378" width="278" height="58" rx="15" fill="#302817" stroke="#ffc857"/>
  <text x="819" y="415" fill="#ffe0a0">Debug with logic.</text>
</g>
<text x="48" y="486" fill="#36e6a0" font-family="monospace" font-size="23">$ ./debug --fast</text>
<text x="48" y="522" fill="#c7d4e2" font-family="monospace" font-size="20">Detect the bug. Understand it. Fix it with logic.</text>
<text x="48" y="562" fill="#ffc857" font-family="monospace" font-size="25">&lt;/&gt; while (alive) { learn(); code(); build(); }</text>
<rect x="48" y="578" width="13" height="4" fill="#36e6a0" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>
