<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .s{animation:mv 4s linear infinite}
    @keyframes mv{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
    .b{animation:bl 1.6s ease-in-out infinite}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#g)" stroke-width="2"/>
  <line class="s" x1="0" y1="12" x2="900" y2="12" stroke="#3DDC84" stroke-width="2" stroke-dasharray="6 34" opacity=".7"/>
  <rect class="b" x="440" y="7" width="20" height="10" rx="2" fill="#FFB000"/>
</svg>
