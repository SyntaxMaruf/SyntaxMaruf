<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace">
<defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset="0.35" stop-color="#39ff14"/><stop offset="0.65" stop-color="#ffb000"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<line x1="40" y1="20" x2="400" y2="20" stroke="url(#lg)" stroke-width="2"/>
<line x1="500" y1="20" x2="860" y2="20" stroke="url(#lg)" stroke-width="2"/>
<text x="450" y="27" font-size="20" text-anchor="middle" fill="#39ff14" filter="url(#glow)">&lt;/&gt;<animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></text>
