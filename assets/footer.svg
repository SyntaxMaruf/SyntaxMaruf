<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="while alive learn code repeat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
  </defs>
  <style>
    .t{font-family:'Courier New',Consolas,Menlo,monospace}
    .cur{animation:b 1s steps(2,start) infinite}
    @keyframes b{to{visibility:hidden}}
    .l1{animation:f 6s ease-in-out infinite}
    .l2{animation:f 6s ease-in-out 1s infinite}
    .l3{animation:f 6s ease-in-out 2s infinite}
    @keyframes f{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect x="20" y="10" width="860" height="90" rx="14" fill="#0b0f0c" stroke="url(#g)" stroke-width="2"/>
  <text class="t" x="450" y="40" text-anchor="middle" font-size="20" fill="#E6EDF3">
    <tspan fill="#FFB000">while</tspan>(alive) {
  </text>
  <text class="t" x="450" y="66" text-anchor="middle" font-size="20">
    <tspan class="l1" fill="#3DDC84">learn();</tspan><tspan fill="#8b949e">  </tspan><tspan class="l2" fill="#3DDC84">code();</tspan><tspan fill="#8b949e">  </tspan><tspan class="l3" fill="#3DDC84">repeat();</tspan>
  </text>
  <text class="t" x="450" y="90" text-anchor="middle" font-size="20" fill="#E6EDF3">} <tspan class="cur" fill="#FFB000">█</tspan></text>
</svg>
