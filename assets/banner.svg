<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maruf Billah - SyntaxMaruf terminal banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <clipPath id="c1"><rect class="r1" x="0" y="0" height="320" width="0"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="0" y="0" height="320" width="0"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="0" y="0" height="320" width="0"/></clipPath>
    <clipPath id="c4"><rect class="r4" x="0" y="0" height="320" width="0"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Courier New',Consolas,Menlo,monospace;font-size:20px}
    .p{fill:#3DDC84}
    .w{fill:#E6EDF3}
    .m{fill:#8b949e}
    .a{fill:#FFB000}
    .r1{animation:k1 14s steps(30,end) infinite}
    .r2{animation:k2 14s steps(30,end) infinite}
    .r3{animation:k3 14s steps(30,end) infinite}
    .r4{animation:k4 14s steps(40,end) infinite}
    @keyframes k1{0%,3%{width:0}9%,94%{width:900px}100%{width:0}}
    @keyframes k2{0%,10%{width:0}22%,94%{width:900px}100%{width:0}}
    @keyframes k3{0%,24%{width:0}31%,94%{width:900px}100%{width:0}}
    @keyframes k4{0%,33%{width:0}56%,94%{width:900px}100%{width:0}}
    .cur{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .glow{animation:fl 3s ease-in-out infinite}
    @keyframes fl{0%,100%{opacity:.10}50%{opacity:.22}}
  </style>

  <!-- window -->
  <rect x="20" y="20" width="860" height="280" rx="16" fill="#0b0f0c" stroke="url(#g)" stroke-width="2"/>
  <rect x="21" y="21" width="858" height="40" rx="15" fill="#121a14"/>
  <circle cx="48" cy="41" r="7" fill="#ff5f56"/>
  <circle cx="72" cy="41" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="41" r="7" fill="#27c93f"/>
  <text x="450" y="47" text-anchor="middle" class="t m" style="font-size:15px">maruf@syntax:~/profile</text>
  <circle class="dot" cx="800" cy="41" r="5" fill="#3DDC84"/>
  <text x="813" y="46" class="t p" style="font-size:14px">online</text>

  <!-- big faint glyph -->
  <text class="t a glow" x="700" y="250" style="font-size:150px;font-weight:bold">{ }</text>

  <!-- row 1 -->
  <g clip-path="url(#c1)">
    <text class="t" x="44" y="105"><tspan class="p">$ </tspan><tspan class="w">whoami</tspan></text>
  </g>
  <!-- row 2 -->
  <g clip-path="url(#c2)">
    <text class="t" x="44" y="155" style="font-size:32px;font-weight:bold"><tspan class="p">&gt; </tspan><tspan class="a">Maruf Billah</tspan><tspan class="m"> // </tspan><tspan class="w">SyntaxMaruf</tspan></text>
  </g>
  <!-- row 3 -->
  <g clip-path="url(#c3)">
    <text class="t" x="44" y="200"><tspan class="p">$ </tspan><tspan class="w">cat mission.txt</tspan></text>
  </g>
  <!-- row 4 -->
  <g clip-path="url(#c4)">
    <text class="t" x="44" y="236"><tspan class="p">&gt; </tspan><tspan class="w">Write clean C. Think like an engineer. Ship real projects.</tspan></text>
  </g>
  <!-- prompt -->
  <text class="t" x="44" y="278"><tspan class="p">$ </tspan><tspan class="a cur">█</tspan></text>
</svg>
